# エモカラ収録曲を、Utaemoの曲カタログから毎日自動で同期する。
# 手動実行: GitHub の Actions タブ →「エモカラ収録曲の同期」→ Run workflow
name: エモカラ収録曲の同期

on:
  schedule:
    - cron: '17 19 * * *'   # 毎日 04:17 (日本時間)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-emocara
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Utaemoの曲カタログから再生成
        id: sync
        run: |
          out=$(node scripts/sync-emocara.mjs)
          echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
      - name: 変更があればコミットして公開
        if: startsWith(steps.sync.outputs.result, 'changed')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/emocara-songs.json
          git commit -m "エモカラ収録曲をUtaemoの曲カタログと同期 (${{ steps.sync.outputs.result }})"
          git push
          # GITHUB_TOKENでのpushはPagesの再公開が走らない場合があるため、公開を明示的に依頼する
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages再公開の依頼に失敗(自動公開に任せます)"
        env:
          GH_TOKEN: ${{ github.token }}
