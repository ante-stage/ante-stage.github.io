<body data-page="songs">

<main id="main"><div class="pg">
  <div class="pghead"><div class="h"><small>SETLIST</small><h1>歌える曲</h1></div></div>
  <div class="card rv" id="request">
    <div class="toolbar"><span class="songN" id="songN"></span><span id="reqClosed" class="note" style="margin:0" hidden>いまはリクエストをお休み中です</span><button class="btn sm" id="openReq">🎤 曲をリクエスト</button></div>
    <input class="search" id="q" type="search" placeholder="曲名・アーティストで探す" aria-label="曲を検索">
    <div class="chips" id="chips"></div>
    <ul class="songs" id="songList"></ul>
    <p class="note">曲は順次追加していきます。</p>
  </div>
  <section class="sec" id="roulette">
    <div class="h"><small>ROULETTE</small><h2>おまかせ選曲</h2></div>
    <div class="card rv roulette">
      <div class="slot" id="slot"><b>どの曲が出るかな？</b><small>ボタンを押してね</small></div>
      <div style="display:grid;gap:8px"><button class="btn sm" id="spin">♡ まわす</button><button class="btn ghost sm" id="slotReq" hidden>この曲をリクエスト</button></div>
    </div>
  </section>
  <section class="sec" id="emocara">
    <div class="h"><small>EMOCARA</small><h2>エモカラ収録曲</h2></div>
    <div class="card rv">
      <p class="note nb" style="margin:0 0 12px"><span>ミラティブのカラオケアプリ</span><span>「エモカラ」に収録されている</span><span>曲の一覧です。</span><br><span>歌える曲リストとは</span><span>別になっています。</span></p>
      <a class="btn" href="emocara.html" style="display:block;text-align:center">エモカラ収録曲をすべて見る</a>
    </div>
  </section>
</div></main>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt">
  <form class="sheet" id="reqForm">
    <h3 id="dt">曲をリクエスト</h3>
    <label for="reqSong">曲名（必須）</label><input id="reqSong" maxlength="100" required>
    <label for="reqArtist">アーティスト（わかれば）</label><input id="reqArtist" maxlength="100">
    <label for="reqName">ニックネーム（任意）</label><input id="reqName" maxlength="40" autocomplete="nickname">
    <label for="reqMsg">ひとこと（任意）</label><textarea id="reqMsg" maxlength="200"></textarea>
    <div class="row"><button type="button" class="btn ghost" id="reqCancel">やめる</button><button type="submit" class="btn">送信する</button></div>
  </form>
</div>

<script src="assets/site.js?v=20261028a" defer></script>
